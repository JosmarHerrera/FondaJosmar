spring.application.name=fonda

# Railway asigna el puerto en la variable PORT
server.port=${PORT:7071}
server.address=0.0.0.0

spring.jpa.hibernate.ddl-auto=update

# ===== DB por variables (Railway) =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.mvc.formcontent.putfilter.enabled=true

# ===== Eureka (tu server en Railway) =====
eureka.client.service-url.defaultZone=https://eurekajosmar-production.up.railway.app/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Importante en Railway (para que no se registre como localhost)
eureka.instance.hostname=${RAILWAY_PUBLIC_DOMAIN}
eureka.instance.nonSecurePort=${PORT}
eureka.instance.prefer-ip-address=false

# Para que se limpien rápido instancias DOWN
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30

# ===== Uploads (en Railway NO uses ruta de Windows) =====
file.upload-dir=${UPLOAD_DIR:/tmp/uploads}
